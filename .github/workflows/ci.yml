name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: 'warpin-*/go.sum'
      - run: python3 scripts/check.py test ./...
      - run: python3 scripts/check.py vet ./...
      - run: python3 scripts/check.py --module warpin-payment --module warpin-http --module warpin-http-hertz test -race ./...
